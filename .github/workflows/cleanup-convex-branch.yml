name: Cleanup branched Convex deployment

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup-convex-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Delete branched Convex deployment (if present)
        env:
          CONVEX_ACCESS_TOKEN: ${{ secrets.CONVEX_ACCESS_TOKEN }}
          CONVEX_PROJECT_ID: ${{ vars.CONVEX_PROJECT_ID }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: bun scripts/cleanup-convex-branch.ts
