<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Ingen internetforbindelse</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Arial, sans-serif;
        background: #ffffff;
        color: #252525;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }

      main {
        max-width: 420px;
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      p {
        margin: 0 0 24px;
        color: #646464;
        line-height: 1.5;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        padding: 0 20px;
        border-radius: 10px;
        background: #4f46e5;
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #818cf8;
        outline-offset: 3px;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #252525;
          color: #fafafa;
        }

        p {
          color: #b8b8b8;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ingen internetforbindelse</h1>
      <p>Opret forbindelse igen, og prøv derefter at åbne appen.</p>
      <a href="/">Prøv igen</a>
    </main>
  </body>
</html>
